name: Run Telegram Checklist Bot

on:
  schedule:
    - cron: "0 22 * * 0-4"
    - cron: "0 1 * * 1-5"
    - cron: "10 8 * * 1-4"

  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "How long to keep the bot online (minutes)"
        required: false
        default: "30"
      send_poll_on_start:
        description: "Send morning poll when bot starts (true/false)"
        required: false
        default: "false"
      verbose:
        description: "Enable extra logging (true/false)"
        required: false
        default: "true"
      skip_commit:
        description: "Skip committing checklists.json after run (true/false)"
        required: false
        default: "false"

concurrency:
  group: checklist-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Restore checklists.json from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git show origin/main:checklists.json >/dev/null 2>&1; then
            git show origin/main:checklists.json > checklists.json
            echo "Restored checklists.json from main"
          else
            echo "{}" > checklists.json
            echo "Initialized new checklists.json"
          fi

      - name: Decide run mode (duration / poll) by schedule or manual inputs
        id: decide
        shell: bash
        run: |
          set -euo pipefail

          DURATION="${{ github.event.inputs.duration_minutes || '30' }}"
          SEND_POLL="${{ github.event.inputs.send_poll_on_start || 'false' }}"

          if [[ -n "${{ github.event.schedule }}" ]]; then
            CRON="${{ github.event.schedule }}"

            if [[ "$CRON" == "0 22 * * 0-4" ]]; then
              DURATION="60"
              SEND_POLL="true"
            elif [[ "$CRON" == "0 1 * * 1-5" ]]; then
              DURATION="60"
              SEND_POLL="false"
            elif [[ "$CRON" == "10 8 * * 1-4" ]]; then
              DURATION="60"
              SEND_POLL="false"
            fi
          fi

          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "send_poll=$SEND_POLL" >> "$GITHUB_OUTPUT"

          echo "Selected: duration=$DURATION, send_poll=$SEND_POLL"

        - name: Run bot
          env:
            BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
            CHAT_ID: ${{ secrets.CHAT_ID }}

            COS_ID: ${{ secrets.COS_ID }}
            COS_TOPIC_URL: ${{ secrets.COS_TOPIC_URL }}

            MC_ID: ${{ secrets.MC_ID }}
            MC_TOPIC_URL: ${{ secrets.MC_TOPIC_URL }}
  
            MC_FORM_URL: "https://docs.google.com/forms/d/e/1FAIpQLSfjeklk85kKJdP_ELHelTWR3UFHLY0EfW5dFEUiKG4PRPB8JQ/viewform?usp=header"

            DROP_PENDING: "true"
            VERBOSE: ${{ github.event.inputs.verbose || 'true' }}
            DURATION_MINUTES: ${{ steps.decide.outputs.duration }}
            SLEEP_WARNING_SECONDS: "60"

            SEND_MORNING_POLL: ${{ steps.decide.outputs.send_poll }}

            MORNING_POLL_SGT_HOUR: "6"
            MORNING_POLL_SGT_MINUTE: "0"
            MORNING_POLL_WINDOW_MINUTES: "60"

            RESET_CHECKS_ON_BOOT: "true"
            CLEAR_ACTIVE_DUTY_ON_BOOT: "true"

        run: node bot.js

      - name: Commit & push updated checklists.json
        if: ${{ github.event.inputs.skip_commit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add checklists.json
          git commit -m "Update checklist data [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main
